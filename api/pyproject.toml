[project]
name = "api"
version = "0.1.0"
description = "API server — FastAPI, WebSocket, streaming"
requires-python = ">=3.12"
dependencies = [
    "schema",
    "db",
    "agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
