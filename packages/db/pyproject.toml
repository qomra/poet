[project]
name = "db"
version = "0.1.0"
description = "Database layer — SQLAlchemy + Alembic"
requires-python = ">=3.12"
dependencies = [
    "schema",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
